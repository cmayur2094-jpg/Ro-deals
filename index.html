<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ro Deals | Best Products</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6fa;
  color: #222;
}

header {
  background: #111827;
  color: white;
  padding: 22px 15px;
  text-align: center;
}

header h1 {
  color: #fbbf24;
  margin: 0;
}

header p {
  margin-bottom: 0;
}

.notice {
  padding: 12px;
  text-align: center;
  background: #fff3cd;
  font-size: 13px;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 18px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
  margin-bottom: 20px;
}

.products {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.card {
  background: white;
  padding: 12px;
  border-radius: 12px;
  box-shadow: 0 3px 10px #00000010;
  display: flex;
  flex-direction: column;
}

.card img {
  width: 100%;
  height: 145px;
  object-fit: contain;
}

.card h3 {
  font-size: 15px;
  min-height: 36px;
}

.price {
  color: #047857;
  font-weight: bold;
}

.buy {
  background: #fbbf24;
  color: #111;
  text-align: center;
  padding: 11px 5px;
  text-decoration: none;
  border-radius: 7px;
  font-weight: bold;
  margin-top: auto;
}

footer {
  background: #111827;
  color: white;
  text-align: center;
  padding: 20px;
  margin-top: 25px;
  font-size: 13px;
}

@media (min-width: 650px) {
  .products {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
</style>
</head>

<body>

<header>
  <h1>Ro Deals 🛍️</h1>
  <p>Discover Products. Find Great Deals.</p>
</header>

<div class="notice">
  Affiliate disclosure: We may earn a commission from qualifying purchases.
</div>

<main class="container">

  <input
    type="search"
    id="search"
    placeholder="🔍 Search products..."
  >

  <div class="products" id="products"></div>

</main>

<footer>
  <p>© 2026 Ro Deals</p>
  <p>Prices and availability may change on the retailer's website.</p>
</footer>

<script>
const products = [
  {
    name: "Cricket Bat",
    price: "Check latest price",
    image: "https://placehold.co/400x300?text=Cricket+Bat",
    link: "https://example.com/"
  },
  {
    name: "Sports Shoes",
    price: "Check latest price",
    image: "https://placehold.co/400x300?text=Sports+Shoes",
    link: "https://example.com/"
  },
  {
    name: "Wireless Earbuds",
    price: "Check latest price",
    image: "https://placehold.co/400x300?text=Earbuds",
    link: "https://example.com/"
  },
  {
    name: "Smart Watch",
    price: "Check latest price",
    image: "https://placehold.co/400x300?text=Smart+Watch",
    link: "https://example.com/"
  }
];

const container = document.getElementById("products");

function showProducts(items) {
  container.replaceChildren();

  items.forEach(product => {
    const card = document.createElement("article");
    card.className = "card";

    const img = document.createElement("img");
    img.src = product.image;
    img.alt = product.name;
    img.loading = "lazy";

    const title = document.createElement("h3");
    title.textContent = product.name;

    const price = document.createElement("p");
    price.className = "price";
    price.textContent = product.price;

    const button = document.createElement("a");
    button.className = "buy";
    button.textContent = "Buy Now";
    button.href = product.link;
    button.target = "_blank";
    button.rel = "sponsored noopener noreferrer";

    card.append(img, title, price, button);
    container.appendChild(card);
  });
}

document.getElementById("search").addEventListener("input", e => {
  const query = e.target.value.toLowerCase();

  showProducts(
    products.filter(p => p.name.toLowerCase().includes(query))
  );
});

showProducts(products);
</script>

</body>
</html>
